server:
  port: ${PORT:10000}
  servlet:
    context-path: /api/v1

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  application:
    name: smart-homeopathic-college-backend

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/bwnhmch}
      auto-index-creation: ${SPRING_DATA_MONGODB_AUTO_INDEX_CREATION:false}

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:bwnhmch@gmail.com}
    password: ${SMTP_PASSWORD:axgmsnipgzdzwuhp}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:GenerateAVeryLongRandomSecretAtLeast32Characters}
    expiration-ms: ${JWT_EXPIRATION:86400000} # 24 Hours
    refresh-expiration-ms: 604800000 # 7 Days
  cors:
    allowed-origins: ${CLIENT_URL:https://bwnhmch-qu7p.vercel.app}

# Cloudinary Storage
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:ndytm2fy}
  api-key: ${CLOUDINARY_API_KEY:796437452988145}
  api-secret: ${CLOUDINARY_API_SECRET:y0NqZCj61XzTaiiIDvxG5TS7drQ}

# OpenAPI Swagger Config
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    root: INFO
    com.homeopathy.college: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.security: INFO
