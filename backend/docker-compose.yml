version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: bhmch-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: homeopathy_erp
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhmch-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017/homeopathy_erp
      - JWT_SECRET=9a4f2c8d1e6b3a7f0e9c8b7a6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0f9e8d7c
      - SPRING_PROFILES_ACTIVE=dev
    depends_on:
      - mongodb

volumes:
  mongo_data:
